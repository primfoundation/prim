name: Foundation Library MCP
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prim-library-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install pinned build and test dependencies
        run: python -m pip install -c services/library/constraints.txt ./services/library build setuptools wheel PyYAML
      - name: Verify protocols, library and inherited Foundation checks
        run: python tools/verify_library.py --output "$RUNNER_TEMP/library-verification.json"
      - name: Build installable distributions
        run: python -m build --no-isolation services/library
      - name: Install wheel into a clean environment and exercise it outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install -c services/library/constraints.txt services/library/dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" -m pip check
          SMOKE="$GITHUB_WORKSPACE/services/library/tests/installed_smoke.py"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/installed/bin/python" "$SMOKE" > "$RUNNER_TEMP/library-installed-smoke.json"
      - name: Retain reports and installable packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prim-foundation-mcp-alpha
          path: |
            ${{ runner.temp }}/library-verification.json
            ${{ runner.temp }}/library-installed-smoke.json
            services/library/dist/*.whl
            services/library/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
