name: Library build inputs
on:
  pull_request:
    paths: ['.github/workflows/library-build-inputs.yml']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 65b956b03c5eee4b309bbc61df2a57e413b34fb0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Export tracked source and resolved public binary dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/library-inputs/wheels"
          git archive --format=tar HEAD > "$RUNNER_TEMP/library-inputs/prim.tar"
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/library-inputs/wheels" 'mcp==2.1.1' 'PyYAML==6.0.3' 'jsonschema==4.26.0' 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
          cd "$RUNNER_TEMP/library-inputs"
          sha256sum prim.tar wheels/* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prim-library-build-inputs
          path: ${{ runner.temp }}/library-inputs/
          if-no-files-found: error
          retention-days: 7
