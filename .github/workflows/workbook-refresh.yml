name: Workbook snapshot refresh
on:
  pull_request:
    paths:
      - '.github/workflows/workbook-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/workbook-profile-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/workbook-profile-migration
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned generation dependencies
        run: python -m pip install -c services/library/constraints.txt ./services/library PyYAML
      - name: Refresh deterministic outputs and run Library tests
        env:
          PYTHONPATH: services/library/src
        run: |
          python tools/profile_catalog.py discover profiles --output registry/profiles.generated.json
          python tools/build_library.py
          python tools/profile_catalog.py discover profiles --check registry/profiles.generated.json
          python tools/build_library.py --check
          python -m unittest discover -s services/library/tests -v
          tmp="$(mktemp -d)"
          prim-library create primfoundation/workbook --version 0.1.0-dev.1 --output "$tmp/book"
          prim-library validate primfoundation/workbook --version 0.1.0-dev.1 "$tmp/book/workbook.json"
      - name: Remove this one-shot workflow and bound changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/workbook-refresh.yml
          python - <<'PY'
          import subprocess
          exact = {'registry/profiles.generated.json','services/library/src/prim_library/data/library.json','.github/workflows/workbook-refresh.yml'}
          paths=[]
          for line in subprocess.check_output(['git','status','--porcelain=v1'],text=True).splitlines():
              p=line[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              paths.append(p)
          bad=[p for p in paths if p not in exact and not p.startswith('services/library/src/prim_library/data/resources/')]
          if bad: raise SystemExit('unexpected paths: '+repr(bad))
          print('\n'.join(paths))
          PY
      - name: Commit refreshed immutable definition snapshot
        run: |
          git config user.name 'prim-foundation-generation-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A registry/profiles.generated.json services/library/src/prim_library/data .github/workflows/workbook-refresh.yml
          git commit -m 'G1: refresh Workbook definition snapshot after migration note'
          git push origin HEAD:codex/workbook-profile-migration
