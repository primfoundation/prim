name: Foundation program verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prim-program-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Install reference tooling dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify Foundation tools, ORF compatibility and existing SDK
        run: python tools/verify.py --with-sdk --output "$RUNNER_TEMP/prim-verification.json"
      - name: Verify pinned incubator blobs and synthetic legacy behavior
        run: python tools/incubator_conformance.py > "$RUNNER_TEMP/prim-incubator-conformance.json"
      - name: Retain scoped verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prim-foundation-verification
          path: |
            ${{ runner.temp }}/prim-verification.json
            ${{ runner.temp }}/prim-incubator-conformance.json
          if-no-files-found: warn
          retention-days: 30
