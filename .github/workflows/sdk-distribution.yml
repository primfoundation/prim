name: Foundation SDK distribution
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prim-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
        working-directory: sdk/typescript
      - run: npm run typecheck && npm test
        working-directory: sdk/typescript
      - name: Build, install and exercise the actual package outside the checkout
        run: node sdk/typescript/scripts/installed-smoke.mjs "$RUNNER_TEMP/prim-sdk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prim-sdk-development-package
          path: ${{ runner.temp }}/prim-sdk/*
          if-no-files-found: error
          retention-days: 30
