[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-product-format"
version = "1.0.0"
description = "A canonical durable graph for product definition, experience, work, and proof"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Eidos AGI", email = "daniel@eidosagi.com"}]
keywords = ["product", "format", "agents", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/eidos-agi/opf"
Repository = "https://github.com/eidos-agi/opf"
Issues = "https://github.com/eidos-agi/opf/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
opf-validate = "opf.validate:main"

[tool.hatch.build.targets.wheel]
packages = ["opf"]
